<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de soluciones digitales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #161b22;
      color: #e6edf3;
    }

    #chat {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      background: #161b22;
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 10px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      color: #e6edf3;
    }

    .av {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: rgba(63, 185, 80, 0.14);
      color: #3fb950;
    }

    .av svg {
      width: 20px;
      height: 20px;
    }

    .chat-head-copy {
      min-width: 0;
    }

    .chat-head b,
    .chat-head small {
      display: block;
    }

    .chat-head b {
      font-size: 14px;
    }

    .chat-head small {
      margin-top: 2px;
      color: #3fb950;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #161b22;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: min(760px, 82%);
      margin-bottom: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.bot {
      margin-right: auto;
      background: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      margin-left: auto;
      background: #1f6feb;
      color: #e6edf3;
      border-bottom-right-radius: 4px;
    }

    .sugs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 760px;
      margin: 4px 0 12px;
    }

    .sugs button {
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #21262d;
      color: #58a6ff;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .sugs button:hover {
      background: #30363d;
      border-color: #484f58;
    }

    .aviso-chat {
      display: none;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #161b22;
      border-top: 1px solid #30363d;
    }

    .chat-form input {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 0 12px;
      outline: none;
      font: inherit;
      background: #0d1117;
      color: #e6edf3;
    }

    .chat-form input:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
    }

    .chat-form button {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      background: #238636;
      color: #fff;
      cursor: pointer;
    }

    .chat-form button:disabled,
    .chat-form input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .chat-form button svg {
      width: 18px;
      height: 18px;
    }

    @media (min-width: 900px) {
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      #chat {
        max-width: 760px;
        height: calc(100vh - 48px);
        height: calc(100dvh - 48px);
        border: 1px solid #30363d;
        border-radius: 12px;
        box-shadow: 0 18px 45px rgba(1, 4, 9, 0.35);
      }
    }
  </style>
</head>
<body>
  <div id="chat" role="dialog" aria-label="Chat de cotizaciones y soluciones digitales">
    <div class="chat-head">
      <div class="av" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div class="chat-head-copy">
        <b>Asistente de Dilan Rojas</b>
        <small>Soluciones web y digitales</small>
      </div>
    </div>

    <div class="chat-body" id="chat-body"></div>
    <div class="aviso-chat">Cotizaciones sujetas a los requerimientos, alcance y complejidad de cada proyecto.</div>

    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" placeholder="Cuéntame qué sitio o solución necesitas..." maxlength="500" autocomplete="off" required>
      <button type="submit" id="chat-send" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const body = document.getElementById("chat-body");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const send = document.getElementById("chat-send");
    let historial = [];

    function agregar(texto, tipo) {
      const mensaje = document.createElement("div");
      mensaje.className = "msg " + tipo;
      mensaje.textContent = texto;
      body.appendChild(mensaje);
      body.scrollTop = body.scrollHeight;
      return mensaje;
    }

    function iniciar() {
      agregar("¡Hola! 👋 Soy el asistente de Dilan Rojas. Puedo ayudarte a definir una página web, sistema o solución digital y orientarte sobre una cotización. ¿Qué deseas crear?", "bot");

      const sugerencias = document.createElement("div");
      sugerencias.className = "sugs";
      ["Quiero cotizar una página web", "Necesito una tienda virtual", "Busco un sistema personalizado", "Quiero automatizar mi negocio"].forEach((texto) => {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.textContent = texto;
        boton.addEventListener("click", () => {
          sugerencias.remove();
          enviar(texto);
        });
        sugerencias.appendChild(boton);
      });
      body.appendChild(sugerencias);
      input.focus();
    }

    async function enviar(texto) {
      agregar(texto, "user");
      historial.push({ role: "user", content: texto });
      const escribiendo = agregar("Escribiendo...", "bot");

      send.disabled = true;
      input.disabled = true;

      try {
        const respuesta = await fetch("Chat.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: historial.slice(-10) })
        });
        const datos = await respuesta.json();
        escribiendo.remove();

        if (datos.reply) {
          agregar(datos.reply, "bot");
          historial.push({ role: "assistant", content: datos.reply });
        } else {
          agregar(datos.error || "No pude responder en este momento. Intenta de nuevo.", "bot");
          historial.pop();
        }
      } catch (error) {
        escribiendo.remove();
        agregar("Hubo un problema de conexión. Intenta de nuevo.", "bot");
        historial.pop();
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;

      input.value = "";
      const sugerencias = body.querySelector(".sugs");
      if (sugerencias) sugerencias.remove();
      enviar(texto);
    });

    iniciar();
  </script>
</body>
</html>
